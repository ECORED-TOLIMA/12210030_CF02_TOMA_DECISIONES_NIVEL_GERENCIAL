    <text id="Nodo_de_decisión._Punto_en_el_que_el_gerente_elige_entre_alternativas_se_representa_con_un_cuadrado_del_que_salen_las_opciones_disponibles._Representación_y_uso:_se_dibuja_al_inicio_del_árbol_y_en_cada_punto_donde_la_empresa_vuelve_a_tener_la_palabra._No" data-name="Nodo de decisión.
Punto en el que el gerente elige entre alternativas; se representa con un cuadrado del que salen las opciones disponibles.
Representación y uso: se dibuja al inicio del árbol y en cada punto donde la empresa vuelve a tener la palabra.

No" transform="translate(-5015 -6762)" fill="#12263f" font-size="16" font-family="Roboto-Bold, Roboto" letter-spacing="0.003em" font-weight="700"><tspan x="0" y="15">Nodo de decisión.</tspan><tspan font-family="Roboto-Regular, Roboto" font-weight="400"><tspan x="0" y="39">Punto en el que el gerente elige entre </tspan><tspan x="0" y="63">alternativas; se representa con un </tspan><tspan x="0" y="87">cuadrado del que salen las opciones </tspan><tspan x="0" y="111">disponibles.</tspan><tspan x="0" y="135">Representación y uso: se dibuja al inicio </tspan><tspan x="0" y="159">del árbol y en cada punto donde la </tspan><tspan x="0" y="183">empresa vuelve a tener la palabra.</tspan><tspan x="0" y="207"></tspan></tspan><tspan x="0" y="231">Nodo de azar.</tspan><tspan font-family="Roboto-Regular, Roboto" font-weight="400"><tspan x="0" y="255">Punto en el que el resultado depende de </tspan><tspan x="0" y="279">factores fuera del control del decisor; se </tspan><tspan x="0" y="303">representa con un círculo del que salen </tspan><tspan x="0" y="327">los resultados posibles, cada uno con su </tspan><tspan x="0" y="351">probabilidad.</tspan><tspan x="0" y="375">Representación y uso: las probabilidades </tspan><tspan x="0" y="399">de las ramas de un mismo círculo deben </tspan><tspan x="0" y="423">sumar uno.</tspan><tspan x="0" y="447"></tspan></tspan><tspan x="0" y="471">Nodo terminal.</tspan><tspan font-family="Roboto-Regular, Roboto" font-weight="400"><tspan x="0" y="495">Extremo de cada rama que registra el </tspan><tspan x="0" y="519">resultado final del camino, en valor </tspan><tspan x="0" y="543">monetario, ganancia o pérdida, después </tspan><tspan x="0" y="567">de sumar ingresos y restar costos.</tspan><tspan x="0" y="591">Representación y uso: se anota al final </tspan><tspan x="0" y="615">de cada combinación de decisiones y </tspan><tspan x="0" y="639">eventos.</tspan><tspan x="0" y="663"></tspan></tspan><tspan x="0" y="687">Valor esperado.</tspan><tspan font-family="Roboto-Regular, Roboto" font-weight="400"><tspan x="0" y="711">Promedio ponderado que se obtiene </tspan><tspan x="0" y="735">multiplicando el resultado de cada rama </tspan><tspan x="0" y="759">por su probabilidad y sumando los </tspan><tspan x="0" y="783">productos; se calcula de derecha a </tspan><tspan x="0" y="807">izquierda hasta llegar al primer nodo.</tspan><tspan x="0" y="831">Representación y uso: en cada cuadrado </tspan><tspan x="0" y="855">se elige la rama de mayor valor </tspan><tspan x="0" y="879">esperado.</tspan></tspan></text>
